<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MD Poster — Imagen a múltiples páginas</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0f1115;color:#f5f7fa}.wrap{max-width:980px;margin:auto;padding:28px 18px}.card{background:#191d24;border:1px solid #2b313b;border-radius:18px;padding:22px;box-shadow:0 12px 40px #0005}.brand{font-size:24px;font-weight:800;margin-bottom:4px}.muted{color:#9ca6b5}.drop{border:2px dashed #475160;border-radius:14px;padding:42px;text-align:center;cursor:pointer;margin:18px 0}.drop:hover{border-color:#7c8798;background:#1d222b}input,select,button{font:inherit}input[type=number],select{width:100%;padding:11px;border-radius:10px;border:1px solid #39414d;background:#101319;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.preview{margin-top:20px;text-align:center;background:#101319;border-radius:14px;padding:15px}.preview img{max-width:100%;max-height:420px;object-fit:contain}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:10px;padding:12px 18px;background:#fff;color:#111;font-weight:700;cursor:pointer}button.secondary{background:#2a3039;color:#fff}.hidden{display:none}.status{margin-top:12px;color:#aeb8c7}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.drop{padding:28px 12px}}</style></head><body><main class="wrap"><section class="card"><div class="brand">MD Poster</div><div class="muted">Divide una imagen en las páginas que quieras y genera un PDF listo para imprimir.</div><label class="drop" id="drop"><strong>Selecciona una imagen</strong><br><span class="muted">JPG, PNG o WEBP · también puedes arrastrarla aquí</span><input id="file" type="file" accept="image/*" hidden></label><div id="settings" class="hidden"><div class="grid"><div><label>Páginas de ancho</label><input id="cols" type="number" min="1" max="20" value="2"></div><div><label>Páginas de alto</label><input id="rows" type="number" min="1" max="20" value="2"></div><div><label>Papel</label><select id="paper"><option value="a4">A4</option><option value="letter">Carta</option><option value="legal">Oficio</option></select></div><div><label>Orientación</label><select id="orientation"><option value="auto">Automática</option><option value="portrait">Vertical</option><option value="landscape">Horizontal</option></select></div></div><div class="actions"><button id="generate">Generar PDF</button><button class="secondary" id="reset">Cambiar imagen</button></div><div class="status" id="status"></div><div class="preview"><img id="preview"></div></div></section></main><script>const $=id=>document.getElementById(id);let image=null;function load(file){if(!file||!file.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{image=new Image();image.onload=()=>{$('preview').src=r.result;$('settings').classList.remove('hidden');$('status').textContent=`Imagen: ${image.width} × ${image.height} px`};image.src=r.result};r.readAsDataURL(file)}$('drop').onclick=e=>{if(e.target.id!=='file')$('file').click()};$('file').onchange=e=>load(e.target.files[0]);$('drop').ondragover=e=>{e.preventDefault()};$('drop').ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};$('reset').onclick=()=>{image=null;$('settings').classList.add('hidden');$('file').value='';$('preview').src=''};$('generate').onclick=()=>{if(!image)return;const {jsPDF}=window.jspdf;const cols=Math.max(1,+$('cols').value||1),rows=Math.max(1,+$('rows').value||1),paper=$('paper').value,ori=$('orientation').value;const sizes={a4:[210,297],letter:[215.9,279.4],legal:[215.9,355.6]};let [pw,ph]=sizes[paper];let orientation=ori;if(orientation==='auto')orientation=(image.width/image.height>=cols/rows?'landscape':'portrait');if(orientation==='landscape')[pw,ph]=[ph,pw];const pdf=new jsPDF({orientation,unit:'mm',format:paper,compress:true});const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');const dpi=150;canvas.width=Math.round(image.width);canvas.height=Math.round(image.height);ctx.drawImage(image,0,0);const tileW=canvas.width/cols,tileH=canvas.height/rows;$('status').textContent=`Generando ${cols*rows} páginas…`;for(let y=0;y<rows;y++){for(let x=0;x<cols;x++){if(!(x===0&&y===0))pdf.addPage(paper,orientation);const c=document.createElement('canvas');c.width=Math.ceil(tileW);c.height=Math.ceil(tileH);c.getContext('2d').drawImage(canvas,x*tileW,y*tileH,tileW,tileH,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.95);pdf.addImage(data,'JPEG',0,0,pw,ph,undefined,'FAST')}}pdf.save(`MD-Poster-${cols}x${rows}.pdf`);$('status').textContent=`Listo: ${cols*rows} páginas en PDF.`};</script></body></html>
