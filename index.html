<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MD Poster | Imagen a páginas</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b0e13;color:#f5f7fa}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.top{margin-bottom:18px}.brand{font-size:28px;font-weight:850}.sub{color:#929baa}.card{background:#151922;border:1px solid #29303b;border-radius:18px;padding:20px;margin-bottom:16px}.drop{border:2px dashed #414b59;border-radius:15px;padding:38px 18px;text-align:center;cursor:pointer}.drop:hover{background:#1a1f29;border-color:#788393}.hidden{display:none}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:13px;color:#aab3c1;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid #39414d;background:#0e1218;color:#fff}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.pill{background:#202631;border:1px solid #303947;border-radius:999px;padding:8px 12px;font-size:13px}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:12px 17px;font-weight:750;cursor:pointer;background:#fff;color:#111}button.secondary{background:#29313d;color:#fff}.previewTitle{font-weight:750;margin-bottom:12px}.sheet{background:#252b35;border-radius:12px;padding:18px;overflow:auto}.gridpreview{display:grid;gap:4px;max-width:900px;margin:auto;background:#555}.tile{position:relative;background:#fff;min-width:70px;aspect-ratio:1/1.414;overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover}.num{position:absolute;top:4px;left:4px;background:#111d;color:#fff;border-radius:5px;padding:2px 5px;font-size:11px}.note{color:#9099a8;font-size:13px;margin-top:10px}.status{margin-top:10px;color:#aeb7c5}@media(max-width:800px){.controls{grid-template-columns:1fr 1fr}}@media(max-width:480px){.controls{grid-template-columns:1fr}.wrap{padding:14px}.card{padding:15px}}</style></head><body><main class="wrap"><header class="top"><div class="brand">MD Poster</div><div class="sub">Divide una imagen en múltiples páginas y visualiza exactamente cómo quedará antes de imprimir.</div></header><section class="card"><label class="drop" id="drop"><strong>📁 Seleccionar imagen</strong><br><span class="sub">JPG, PNG o WEBP · también puedes arrastrarla aquí</span><input id="file" type="file" accept="image/*" hidden></label></section><section class="card hidden" id="app"><div class="controls"><div class="field"><label>Páginas de ancho</label><input id="cols" type="number" min="1" max="20" value="2"></div><div class="field"><label>Páginas de alto</label><input id="rows" type="number" min="1" max="20" value="2"></div><div class="field"><label>Papel</label><select id="paper"><option value="a4">A4</option><option value="letter">Carta</option><option value="legal">Oficio</option></select></div><div class="field"><label>Orientación</label><select id="orientation"><option value="auto">Automática</option><option value="portrait">Vertical</option><option value="landscape">Horizontal</option></select></div></div><div class="stats"><span class="pill" id="count">4 páginas</span><span class="pill" id="ratio">Vista previa 2 × 2</span><span class="pill" id="size"></span></div><div class="actions"><button id="generate">📄 Generar PDF</button><button class="secondary" id="reset">Cambiar imagen</button></div><div class="status" id="status"></div></section><section class="card hidden" id="previewCard"><div class="previewTitle">Vista previa del póster</div><div class="sheet"><div id="gridpreview" class="gridpreview"></div></div><div class="note">Cada cuadro representa una hoja. El número indica el orden en que debes unirlas.</div></section></main><script>const $=x=>document.getElementById(x);let image=null;function load(file){if(!file||!file.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{image=new Image();image.onload=()=>{$('app').classList.remove('hidden');$('previewCard').classList.remove('hidden');$('size').textContent=`Imagen ${image.width} × ${image.height} px`;update()};image.src=r.result};r.readAsDataURL(file)}function update(){if(!image)return;const c=Math.max(1,+$('cols').value||1),r=Math.max(1,+$('rows').value||1);$('count').textContent=`${c*r} ${c*r===1?'página':'páginas'}`;$('ratio').textContent=`Vista previa ${c} × ${r}`;const g=$('gridpreview');g.style.gridTemplateColumns=`repeat(${c},1fr)`;g.innerHTML='';for(let y=0;y<r;y++)for(let x=0;x<c;x++){const d=document.createElement('div');d.className='tile';const im=document.createElement('img');im.src=image.src;im.style.objectPosition=`${c===1?50:(x/(c-1))*100}% ${r===1?50:(y/(r-1))*100}%`;d.append(im);const n=document.createElement('span');n.className='num';n.textContent=y*c+x+1;d.append(n);g.append(d)}}$('drop').onclick=e=>{if(e.target.id!=='file')$('file').click()};$('file').onchange=e=>load(e.target.files[0]);$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};['cols','rows','paper','orientation'].forEach(id=>$(id).addEventListener('input',update));$('reset').onclick=()=>{image=null;$('app').classList.add('hidden');$('previewCard').classList.add('hidden');$('file').value=''};$('generate').onclick=()=>{if(!image)return;const{jsPDF}=window.jspdf,c=Math.max(1,+$('cols').value||1),r=Math.max(1,+$('rows').value||1),p=$('paper').value,o=$('orientation').value,s={a4:[210,297],letter:[215.9,279.4],legal:[215.9,355.6]};let[w,h]=s[p],ori=o==='auto'?(image.width/image.height>=c/r?'landscape':'portrait'):o;if(ori==='landscape')[w,h]=[h,w];const pdf=new jsPDF({orientation:ori,unit:'mm',format:p,compress:true}),cv=document.createElement('canvas'),cx=cv.getContext('2d');cv.width=image.width;cv.height=image.height;cx.drawImage(image,0,0);const tw=cv.width/c,th=cv.height/r;$('status').textContent=`Generando ${c*r} páginas...`;for(let y=0;y<r;y++)for(let x=0;x<c;x++){if(y||x)pdf.addPage(p,ori);const tile=document.createElement('canvas');tile.width=Math.ceil(tw);tile.height=Math.ceil(th);tile.getContext('2d').drawImage(cv,x*tw,y*th,tw,th,0,0,tile.width,tile.height);pdf.addImage(tile.toDataURL('image/jpeg',.95),'JPEG',0,0,w,h,undefined,'FAST')}pdf.save(`MD-Poster-${c}x${r}.pdf`);$('status').textContent=`✓ PDF listo: ${c*r} páginas.`};</script></body></html>
